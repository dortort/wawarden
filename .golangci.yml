version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - noctx
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        api-fence:
          list-mode: lax
          files:
            - ${base-path}/internal/api/**
          allow:
            - github.com/dortort/wawarden/internal/store/scoped$
          deny:
            - pkg: database/sql
              desc: internal/api reaches data only through internal/store/scoped
            - pkg: mime/multipart
              desc: internal/api reads JSON bodies only
            - pkg: html/template
              desc: internal/api writes JSON only, and a template can call a Request method by name
            - pkg: text/template
              desc: internal/api writes JSON only, and a template can call a Request method by name
            - pkg: modernc.org/sqlite
              desc: the raw database handle lives in internal/store/internal/db
            - pkg: go.mau.fi/whatsmeow
              desc: the protocol client is confined to internal/engine
            - pkg: github.com/dortort/wawarden/internal/store
              desc: internal/api reads the archive only through internal/store/scoped, whose every read takes a grant, and never imports another store package
            - pkg: github.com/dortort/wawarden/internal/engine
              desc: internal/api depends on interfaces that internal/app wires, never on the engine
        store-sql:
          files:
            - $all
            - "!$test"
            - "!${base-path}/internal/store/**"
          deny:
            - pkg: database/sql
              desc: only internal/store talks to a database
        sqlite-driver:
          files:
            - $all
            - "!$test"
            - "!${base-path}/internal/store/internal/db/**"
          deny:
            - pkg: modernc.org/sqlite
              desc: the SQLite driver is confined to internal/store/internal/db, the only holder of a database handle
        age-encryption:
          files:
            - $all
            - "!$test"
            - "!${base-path}/internal/backup/**"
          deny:
            - pkg: filippo.io/age
              desc: age is confined to internal/backup, which encrypts to a recipient and holds no identity
        text-normalisation:
          files:
            - $all
            - "!$test"
            - "!${base-path}/internal/store/scoped/**"
          deny:
            - pkg: golang.org/x/text
              desc: golang.org/x/text is confined to internal/store/scoped, which normalises search queries to NFC
        mcp-library:
          files:
            - $all
            - "!$test"
            - "!${base-path}/internal/api/**"
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: the MCP library is confined to internal/api, which serves its tools behind the client pipeline
            - pkg: github.com/google/jsonschema-go
              desc: the JSON Schema library is confined to internal/api, which builds and checks the MCP tool schemas
        test-only-modules:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: pgregory.net/rapid
              desc: rapid drives property tests only and is never linked into the binary
        neutral-engine:
          files:
            - ${base-path}/internal/engine/**
            - "!${base-path}/internal/engine/wa/**"
            - "!$test"
          deny:
            - pkg: go.mau.fi/whatsmeow
              desc: the engine core handles plain data; only internal/engine/wa imports the protocol library
            - pkg: google.golang.org/protobuf
              desc: the engine core handles plain data; only internal/engine/wa decodes protocol messages
        protocol-library:
          files:
            - $all
            - "!$test"
            - "!${base-path}/internal/engine/wa/**"
            - "!${base-path}/internal/store/session/**"
          deny:
            - pkg: go.mau.fi/whatsmeow
              desc: only internal/engine/wa uses the protocol library, and internal/store/session its device store
            - pkg: google.golang.org/protobuf
              desc: only internal/engine/wa decodes protocol messages
            - pkg: go.mau.fi/libsignal
              desc: only internal/engine/wa uses the signal library, to route its log lines through the scrubbing writer
        session-store:
          list-mode: lax
          files:
            - ${base-path}/internal/store/session/**
            - "!$test"
          allow:
            - go.mau.fi/whatsmeow/store$
            - go.mau.fi/whatsmeow/store/sqlstore$
          deny:
            - pkg: go.mau.fi/whatsmeow
              desc: internal/store/session uses only the protocol library's device store packages
            - pkg: google.golang.org/protobuf
              desc: only internal/engine/wa decodes protocol messages
            - pkg: go.mau.fi/libsignal
              desc: only internal/engine/wa uses the signal library, to route its log lines through the scrubbing writer
        signal-logger:
          list-mode: lax
          files:
            - ${base-path}/internal/engine/wa/**
            - "!$test"
          allow:
            - go.mau.fi/libsignal/logger$
          deny:
            - pkg: go.mau.fi/libsignal
              desc: internal/engine/wa uses only the signal library's logger package, to route its lines through the scrubbing writer
        process-execution:
          files:
            - $all
            - "!$test"
            - "!${base-path}/cmd/wawarden/tokencommand.go"
          deny:
            - pkg: os/exec
              desc: only the admin CLI's token command, in cmd/wawarden/tokencommand.go, runs another program
        no-multipart:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: mime/multipart
              desc: only internal/api serves requests, and it reads JSON bodies only
        standard-library-only:
          list-mode: strict
          files:
            - ${base-path}/internal/cursor/**
            - ${base-path}/internal/keys/**
            - ${base-path}/internal/logx/**
            - ${base-path}/internal/ratelimit/**
            - ${base-path}/internal/sanitize/**
            - "!$test"
          allow:
            - $gostd
        no-default-mux-registrars:
          files:
            - $all
          deny:
            - pkg: net/http/pprof
              desc: registers handlers on http.DefaultServeMux
            - pkg: expvar
              desc: registers handlers on http.DefaultServeMux
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^http\.(Serve|ServeTLS|Handle|HandleFunc)$
          pkg: ^net/http$
          msg: build an http.Server with timeouts and an explicit handler in internal/listeners
        - pattern: ^http\.DefaultServeMux$
          pkg: ^net/http$
          msg: "default-mux-proof: http.DefaultServeMux is never served or registered on"
        - pattern: ^http\.(DefaultClient|Get|Post|PostForm|Head)$
          pkg: ^net/http$
          msg: use an http.Client with a timeout and http.NewRequestWithContext
        - pattern: \.(ListenAndServe|ListenAndServeTLS)$
          msg: serve an internal/listeners listener with (*http.Server).Serve
        - pattern: ^net\.(Listen|ListenTCP|ListenUDP|ListenIP|ListenUnix|ListenUnixgram|ListenPacket|ListenMulticastUDP|FileListener|FilePacketConn)$
          pkg: ^net$
          msg: "listeners-only: OS listeners belong in internal/listeners"
        - pattern: ^net\.ListenConfig\.(Listen|ListenPacket)$
          pkg: ^net$
          msg: "listeners-only: OS listeners belong in internal/listeners"
        - pattern: ^tls\.Listen$
          pkg: ^crypto/tls$
          msg: "listeners-only: OS listeners belong in internal/listeners"
        - pattern: ^syscall\.Listen$
          pkg: ^syscall$
          msg: "listeners-only: OS listeners belong in internal/listeners"
  exclusions:
    generated: disable
    rules:
      - path: ^internal/listeners/[^/]+\.go$
        linters:
          - forbidigo
        text: listeners-only
      - path: _test\.go$
        linters:
          - forbidigo
        text: listeners-only
      - path: ^internal/(api/coverage|app/app)_test\.go$
        linters:
          - forbidigo
        text: default-mux-proof

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dortort/wawarden
  exclusions:
    generated: disable

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
