name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, vMAJOR.MINOR.PATCH
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  IMAGE: ghcr.io/dortort/wawarden
  BUILDX_VERSION: v0.37.1

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Check version, tag, environment and CI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check the version format
        run: |
          if [[ ! $VERSION =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be vMAJOR.MINOR.PATCH, for example v0.1.0"
            exit 1
          fi

      - name: Check that the tag does not exist
        run: |
          status=0
          git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$VERSION" > /dev/null || status=$?
          case $status in
            2) echo "Tag $VERSION is free." ;;
            0) echo "::error::tag $VERSION already exists"; exit 1 ;;
            *) echo "::error::git ls-remote failed with exit status $status"; exit 1 ;;
          esac

      - name: Check the release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! env_json=$(gh api "repos/$GITHUB_REPOSITORY/environments/release"); then
            echo "::error::cannot read the release environment; create and protect it as RELEASING.md describes"
            exit 1
          fi
          if ! jq -e '[.protection_rules[]?.type] | index("required_reviewers") != null' <<< "$env_json" > /dev/null; then
            echo "::error::the release environment has no required reviewers"
            exit 1
          fi
          if ! jq -e '.deployment_branch_policy == {"protected_branches": false, "custom_branch_policies": true}' <<< "$env_json" > /dev/null; then
            echo "::error::the release environment must limit deployments with custom branch policies"
            exit 1
          fi
          policies=$(gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" \
            --jq '[.branch_policies[] | .type + ":" + .name] | sort | join(",")')
          if [ "$policies" != branch:main ]; then
            echo "::error::the release environment allows '$policies'; it must allow only branch:main"
            exit 1
          fi

      - name: Check that CI passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --branch main --event push --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::ci.yml has no successful push run on $GITHUB_SHA; wait for CI on main to pass"
            exit 1
          fi

  build:
    name: Build
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
          cache-binary: false

      - name: Build binaries and OCI image
        id: build
        run: |
          digest=$(hack/repro-build.sh oci)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM for linux/amd64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/wawarden_${{ env.VERSION }}_linux_amd64
          format: spdx-json
          output-file: dist/wawarden_${{ env.VERSION }}_linux_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM for linux/arm64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/wawarden_${{ env.VERSION }}_linux_arm64
          format: spdx-json
          output-file: dist/wawarden_${{ env.VERSION }}_linux_arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: |
            dist/wawarden_*_linux_amd64
            dist/wawarden_*_linux_arm64
            dist/wawarden_*.spdx.json
            dist/SHA256SUMS
            dist/image-digest
          if-no-files-found: error
          retention-days: 7

  rebuild:
    name: Rebuild and compare
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
          cache-binary: false

      - name: Rebuild binaries and OCI image
        run: hack/repro-build.sh oci

      - name: Generate SBOM for linux/amd64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/wawarden_${{ env.VERSION }}_linux_amd64
          format: spdx-json
          output-file: dist/wawarden_${{ env.VERSION }}_linux_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM for linux/arm64
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/wawarden_${{ env.VERSION }}_linux_arm64
          format: spdx-json
          output-file: dist/wawarden_${{ env.VERSION }}_linux_arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download build results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: ${{ runner.temp }}/build

      - name: Compare with the build job
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_DIR: ${{ runner.temp }}/build
        run: |
          diff -u "$BUILD_DIR/SHA256SUMS" dist/SHA256SUMS
          diff -u "$BUILD_DIR/image-digest" dist/image-digest
          if [ "$(cat dist/image-digest)" != "$BUILD_DIGEST" ]; then
            echo "::error::rebuild digest $(cat dist/image-digest) differs from the build job's $BUILD_DIGEST"
            exit 1
          fi
          (cd "$BUILD_DIR" && sha256sum -c SHA256SUMS)
          volatile='del(.documentNamespace, .creationInfo.created)'
          for arch in amd64 arm64; do
            sbom=wawarden_${VERSION}_linux_$arch.spdx.json
            jq -S "$volatile" "$BUILD_DIR/$sbom" > "$RUNNER_TEMP/build-$sbom"
            jq -S "$volatile" "dist/$sbom" > "$RUNNER_TEMP/rebuild-$sbom"
            diff -u "$RUNNER_TEMP/build-$sbom" "$RUNNER_TEMP/rebuild-$sbom"
          done

  release:
    name: Publish
    needs: [build, rebuild]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker
          cache-binary: false

      - name: Download build results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: ${{ runner.temp }}/build

      - name: Verify build results
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_DIR: ${{ runner.temp }}/build
        run: |
          cd "$BUILD_DIR"
          sha256sum -c SHA256SUMS
          if [ "$(cat image-digest)" != "$BUILD_DIGEST" ]; then
            echo "::error::downloaded image-digest does not match the build job output"
            exit 1
          fi

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image by digest
        id: push
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
          BUILD_DIR: ${{ runner.temp }}/build
        run: |
          digest=$(hack/repro-build.sh push)
          if [ "$digest" != "$BUILD_DIGEST" ]; then
            echo "::error::pushed digest $digest differs from the build job's $BUILD_DIGEST; the untagged index is left unsigned"
            exit 1
          fi
          diff -u "$BUILD_DIR/SHA256SUMS" dist/SHA256SUMS
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image index
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest binary provenance
        id: attest-binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          create-storage-record: false

      - name: Attest SBOM for linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/wawarden_${{ env.VERSION }}_linux_amd64
          sbom-path: ${{ runner.temp }}/build/wawarden_${{ env.VERSION }}_linux_amd64.spdx.json
          create-storage-record: false

      - name: Attest SBOM for linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/wawarden_${{ env.VERSION }}_linux_arm64
          sbom-path: ${{ runner.temp }}/build/wawarden_${{ env.VERSION }}_linux_arm64.spdx.json
          create-storage-record: false

      - name: Tag the image with the version
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | jq -r .)
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$IMAGE:$VERSION resolves to $tagged, expected $DIGEST"
            exit 1
          fi

      - name: Write release notes
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          workflow="$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          {
            echo "Built from commit $GITHUB_SHA with $(go env GOVERSION)."
            echo
            echo "## Container image"
            echo
            echo '```text'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "The image is also tagged \`$VERSION\`. Deploy it by digest: the signature and the attestations cover the index digest above."
            echo
            echo "## Verify"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --cert-identity $GITHUB_SERVER_URL/$workflow"
            echo "cosign verify $IMAGE@$DIGEST --certificate-identity $GITHUB_SERVER_URL/$workflow --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum -c SHA256SUMS"
            for arch in amd64 arm64; do
              echo "gh attestation verify wawarden_${VERSION}_linux_$arch --repo $GITHUB_REPOSITORY --cert-identity $GITHUB_SERVER_URL/$workflow"
            done
            echo '```'
            echo
            echo "## Reproduce"
            echo
            echo "From commit $GITHUB_SHA fetched without tags, as RELEASING.md describes, \`BUILDX_VERSION=$BUILDX_VERSION VERSION=$VERSION hack/repro-build.sh oci\` prints \`$DIGEST\` and writes binaries that match \`SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_DIR: ${{ runner.temp }}/build
          BUNDLE: ${{ steps.attest-binaries.outputs.bundle-path }}
        run: |
          status=0
          git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$VERSION" > /dev/null || status=$?
          if [ "$status" -ne 2 ]; then
            echo "::error::tag $VERSION exists or cannot be checked (git ls-remote exit status $status)"
            exit 1
          fi
          provenance="$RUNNER_TEMP/wawarden_${VERSION}_provenance.sigstore.json"
          cp "$BUNDLE" "$provenance"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/wawarden_${VERSION}_linux_amd64" \
            "dist/wawarden_${VERSION}_linux_arm64" \
            dist/SHA256SUMS \
            "$BUILD_DIR/wawarden_${VERSION}_linux_amd64.spdx.json" \
            "$BUILD_DIR/wawarden_${VERSION}_linux_arm64.spdx.json" \
            "$provenance"

      - name: Check that the release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable || echo unknown)
          if [ "$immutable" != true ]; then
            echo "::error::release $VERSION reports isImmutable=$immutable; it was published while immutable releases were off"
            exit 1
          fi
