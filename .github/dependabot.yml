version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build(deps)"
    ignore:
      # modernc.org/sqlite requires exactly the libc its own go.mod names, so libc moves only with it.
      - dependency-name: "modernc.org/libc"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci(deps)"
    # A CodeQL run fails unless init and analyze are the same version, so every codeql-action action moves together.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns: ["github/codeql-action", "github/codeql-action/*"]
      codeql-action-security:
        applies-to: security-updates
        patterns: ["github/codeql-action", "github/codeql-action/*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build(deps)"

  # The documentation site's Python packages, pinned with hashes by pip-compile.
  - package-ecosystem: "pip"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    commit-message:
      prefix: "docs(deps)"
    groups:
      site:
        patterns: ["*"]
